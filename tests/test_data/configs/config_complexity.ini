[settings]

;___GENERAL SETTINGS___
input = test_data/input/sl_ssj-ud-dev.conllu
output = test_data/output/out_complexity.tsv
cpu_cores = 1
greedy_counter = no

;___TREE SPECIFICATIONS___
size = 2-3
processing_size = 2-3
complete = yes
labeled = yes
fixed = yes
node_type = upos

;___OUTPUT SETTINGS___
detailed_results_file = test_data/output/detailed_results_file_complexity.tsv
example = no
depsearch = no
grew_match = no
max_lines = 0
frequency_threshold = 2
association_measures = no
node_info = no
head_info = yes
label_subtypes = no
complexity_measures = yes
