[settings]

;___GENERAL SETTINGS___
; input contains multi-value features (e.g. PronType=Dem,Rel), which have to be kept whole and matched on any value
input = test_data/input/multi_value_feats.conllu
output = test_data/output/out_multi_value_feats.tsv
cpu_cores = 1
greedy_counter = no

;___TREE SPECIFICATIONS___
size = 1-2
processing_size = 1-2
complete = no
labeled = yes
fixed = yes
node_type = upos+feats

;___TREE RESTRICTIONS___
; PronType=Rel has to match tokens with PronType=Rel, PronType=Dem,Rel and PronType=Int,Rel
head = PronType=Rel
example = yes

;___OUTPUT SETTINGS___
depsearch = no
grew_match = no
max_lines = 0
frequency_threshold = 0
association_measures = yes
node_info = yes
head_info = yes
label_subtypes = no
